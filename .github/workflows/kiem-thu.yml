# Hai cửa kiểm độc lập cho mọi push lên main và mọi pull request. Giữ ổn định tên hiển thị của hai job:
# branch protection tham chiếu trực tiếp các status check này.
name: Kiểm thử

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Chỉ huỷ run cũ của pull request; run push lên main phải chạy xong để tag phát hành tìm được run thành công trên đúng SHA.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kiem-thu:
    name: Code quality and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest (unit + component)
        run: npm test

      # Ghi ra `dist-next` để vừa kiểm biên dịch staging, vừa làm "bản mới" cho ca cập nhật app
      # trong e2e-recovery (artifact-server phục vụ nó ở mode `next`).
      - name: Build staging
        run: npm run build:staging -- --outDir dist-next

      - name: Build recovery
        run: npm run build:recovery

      # Build normal chạy cuối để `dist/` chắc chắn là bundle production.
      # `npm run build` chạy `tsc --noEmit` trước `vite build`, nên đây cũng là bước kiểm kiểu.
      - name: Build normal
        run: npm run build

      # e2e chạy trên Chrome thật (`channel: 'chrome'`), không phải chromium đóng gói kèm.
      - name: Cài Chrome cho Playwright
        run: npx playwright install --with-deps chrome

      - name: Playwright e2e
        run: npm run test:e2e

      - name: Playwright recovery artifact
        run: npm run test:e2e:recovery:built

      - name: Bundle Worker production đúng commit
        run: |
          npx wrangler deploy --config worker/wrangler.toml --env="" --dry-run --outdir "$PWD/worker-bundle"
          test -s worker-bundle/index.js

      - name: Đóng gói artifact phát hành đúng commit
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test -s worker-bundle/index.js
          mkdir release-artifact
          cp -R dist dist-recovery worker-bundle release-artifact/
          cp package.json release-artifact/
          mkdir release-artifact/worker
          cp worker/wrangler.toml release-artifact/worker/
          cd release-artifact
          find dist dist-recovery worker-bundle worker package.json -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 shasum -a 256 > SHA256SUMS
          grep -Eq '  worker-bundle/index\.js$' SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Lưu artifact phát hành bất biến
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 90

      # `trace: 'retain-on-failure'` để lại trace trong test-results/ — mở bằng `npx playwright
      # show-trace` là xem lại được đúng lượt chạy đã đỏ, không phải đoán từ log.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-trace
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Plugin native (TCP, Bluetooth) và manifest chỉ được kiểm khi dựng APK — Vitest mock hết lớp Java.
  apk:
    name: APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Dựng web và chép vào vỏ Android
        run: |
          npm run build
          npx cap sync android

      - name: assembleDebug
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit test JVM (hạn ghi socket máy in)
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

  # Robot chạy tuần tự trên một runner mất ~30 phút, nên chia ra ba runner cô lập: mỗi runner có Vite,
  # Worker và cổng 5175/8787 riêng, trong runner vẫn một tiến trình `robot`. Hai nửa hai-may chia bằng thẻ
  # `shard-a` — nửa sau lấy mọi ca KHÔNG có thẻ, nên ca mới quên gắn thẻ vẫn chạy. `con-lai` lấy mọi suite
  # khác hai-may theo tên file, suite mới tự vào.
  robot-shard:
    name: Robot shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [hai-may-a, hai-may-b, con-lai]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: robot/requirements.txt

      - run: npm ci

      - name: Cài Robot Framework và Google Chrome
        run: ./robot/install.sh --with-deps

      - name: Robot Framework live
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          out=(--output "output-${SHARD}.xml")
          case "${SHARD}" in
            hai-may-a) ./robot/run.sh "${out[@]}" -i shard-a robot/tests/hai-may.robot ;;
            hai-may-b) ./robot/run.sh "${out[@]}" -e shard-a robot/tests/hai-may.robot ;;
            con-lai)
              mapfile -t files < <(find robot/tests -maxdepth 1 -name '*.robot' ! -name hai-may.robot | LC_ALL=C sort)
              ./robot/run.sh "${out[@]}" "${files[@]}" ;;
            *) echo "Shard lạ: ${SHARD}" >&2; exit 1 ;;
          esac

      - name: Robot Framework recovery artifact
        if: matrix.shard == 'con-lai'
        run: |
          rc=0
          npm run test:live:recovery || rc=$?
          mv robot/results/output.xml robot/results/output-recovery.xml || true
          exit "${rc}"

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: robot-output-${{ matrix.shard }}
          path: robot/results/output-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: robot-live-results-${{ matrix.shard }}
          path: robot/results/
          if-no-files-found: ignore
          retention-days: 7

  # Tên "Robot live" là status check mà branch protection và phat-hanh-production.yml tìm đúng từng chữ.
  # `always()` vì job bị skip được tính là đạt; job này phải đỏ khi bất kỳ phần nào đỏ hay bị huỷ, và
  # phải chứng minh mọi ca đã chạy đúng một lần.
  robot-live:
    name: Robot live
    needs: robot-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mọi phần Robot đều đạt
        run: test "${{ needs.robot-shard.result }}" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - run: python -m pip install "$(grep '^robotframework==' robot/requirements.txt)"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: robot-output-*
          path: outputs
          merge-multiple: true

      - name: Mọi ca Robot chạy đúng một lần
        run: python robot/kiem-du-ca.py outputs/*.xml
