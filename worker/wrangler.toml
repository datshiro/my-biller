name = "my-biller-sync"
main = "src/index.ts"
compatibility_date = "2026-08-08"
workers_dev = true

[[durable_objects.bindings]]
name = "SHOP_DO"
class_name = "ShopDO"

[[ratelimits]]
name = "PAIR_RATE_LIMITER"
namespace_id = "2608091857"

[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "HEARTBEAT_RATE_LIMITER"
namespace_id = "2610031744"

[ratelimits.simple]
limit = 6
period = 60

[[d1_databases]]
binding = "ADMIN_DB"
database_name = "my-biller-admin"
database_id = "dd8c1fb7-634f-490e-aba6-fc034d506909"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShopDO"]

[env.staging]
name = "my-biller-sync-staging"

[[env.staging.durable_objects.bindings]]
name = "SHOP_DO"
class_name = "ShopDO"

[[env.staging.ratelimits]]
name = "PAIR_RATE_LIMITER"
namespace_id = "2608110215"

[env.staging.ratelimits.simple]
limit = 20
period = 60

[[env.staging.ratelimits]]
name = "HEARTBEAT_RATE_LIMITER"
namespace_id = "2610031745"

[env.staging.ratelimits.simple]
limit = 6
period = 60

[[env.staging.d1_databases]]
binding = "ADMIN_DB"
database_name = "My-biller-admin-staging"
database_id = "3ac392e2-c6d9-4b5d-a1d8-18cec42b696b"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["ShopDO"]

# Chỉ dùng cho `wrangler dev` của Robot, không deploy: mọi máy giả lập gửi từ cùng 127.0.0.1 nên cần hạn heartbeat cao.
[env.robot]
name = "my-biller-sync-robot"

[[env.robot.durable_objects.bindings]]
name = "SHOP_DO"
class_name = "ShopDO"

[[env.robot.ratelimits]]
name = "PAIR_RATE_LIMITER"
namespace_id = "2610091001"

[env.robot.ratelimits.simple]
limit = 20
period = 60

[[env.robot.ratelimits]]
name = "HEARTBEAT_RATE_LIMITER"
namespace_id = "2610091002"

[env.robot.ratelimits.simple]
limit = 600
period = 60

[[env.robot.d1_databases]]
binding = "ADMIN_DB"
database_name = "my-biller-admin-robot"
database_id = "11111111-1111-1111-1111-111111111111"

[[env.robot.migrations]]
tag = "v1"
new_sqlite_classes = ["ShopDO"]
